name: MiniAuth
version: 1.1.0
main: vn.hauminh.auth.AuthPlugin
api-version: '1.21'
author: Hậu Minh
description: Paper authentication plugin with SQLite or MySQL
commands:
  register:
    description: Đăng ký tài khoản
    usage: /register <mật_khẩu> <nhập_lại>
    aliases: [reg]
  login:
    description: Đăng nhập
    usage: /login <mật_khẩu>
    aliases: [l]
  logout:
    description: Đăng xuất
    usage: /logout
